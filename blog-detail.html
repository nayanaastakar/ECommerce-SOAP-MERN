<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Timeless Tales Blog</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="images/timeless-tales-favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#7B2CBF">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f8fafc; color: #1f2937; }
        .container { max-width: 1000px; margin: 0 auto; padding: 24px; }
        header, footer { background: white; box-shadow: 0 10px 30px rgba(15,23,42,0.08); }
        .header-inner, .footer-inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 24px; }
        .logo { font-size: 1.6rem; font-weight: 700; color: #1f2937; text-decoration: none; display: inline-flex; gap: 8px; }
        .nav { display: flex; flex-wrap: wrap; gap: 12px; }
        .nav a { color: #475569; text-decoration: none; padding: 10px 14px; border-radius: 999px; transition: background 0.2s ease; }
        .nav a:hover { background: #eef2ff; }
        .hero { padding: 48px 0; display: grid; gap: 22px; }
        .hero h1 { font-size: clamp(2.4rem, 4vw, 3.4rem); }
        .hero .meta { color: #6b7280; line-height: 1.7; }
        .post-image { width: 100%; border-radius: 24px; overflow: hidden; margin: 30px 0; }
        .post-image img { width: 100%; display: block; object-fit: cover; min-height: 380px; }
        .post-body { display: grid; gap: 22px; }
        .post-body p { color: #475569; line-height: 1.85; }
        .related { margin-top: 40px; }
        .related h2 { margin-bottom: 20px; }
        .related-grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); }
        .related-card { background: white; border-radius: 22px; overflow: hidden; border: 1px solid rgba(15,23,42,0.08); }
        .related-card img { width: 100%; height: 200px; object-fit: cover; }
        .related-card .related-body { padding: 18px; }
        .related-card .related-title { font-weight: 700; margin-bottom: 6px; }
        .related-card .related-excerpt { color: #475569; font-size: 0.95rem; margin-bottom: 12px; }
        .related-card a { color: #4338ca; font-weight: 700; }
        .footer { margin-top: 48px; }
        @media (max-width: 860px) { .hero { text-align: center; } }

        /* Timeless Tales brand overrides */
        :root {
            --tt-bg: #F8F5E9;
            --tt-surface: #FFFFFF;
            --tt-purple: #7B2CBF;
            --tt-muted: #5A5B7A;
        }
        body { background: var(--tt-bg) !important; }
        header, footer, .post-image, .related-card { background: var(--tt-surface) !important; }
        .logo { color: var(--tt-text) !important; }
        .nav a:hover { background: rgba(123,44,191,0.1) !important; }
        .read-more, .btn { background: linear-gradient(135deg, var(--tt-purple), #C77DFF); color: white; }
    </style>
</head>
<body>

    <div class="page-loader" id="pageLoader">
        <div class="loader-card">
            <img src="images/timeless-tales-logo.svg" alt="Timeless Tales logo">
            <div class="loader-ring"></div>
            <div class="loader-text">Timeless Tales — A magical world of books and stories.</div>
        </div>
    </div>

    <header>
        <div class="container header-inner">
            <a class="logo" href="index.html"><img class="logo-img" src="images/timeless-tales-logo.svg" alt="Timeless Tales logo"> Timeless Tales</a>
            <nav class="nav">
                <a href="index.html">Home</a>
                <a href="soap-simple.html">Books</a>
                <a href="blog.html">Blog</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a href="privacy.html">Privacy</a>
                <a href="admin.html">Admin</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h1 id="postTitle">Blog post</h1>
            <div class="meta" id="postMeta">By author · Date</div>
            <div class="post-image"><img id="postImage" src="images/book-covers/To_Kill_a_Mockingbir_1.png" alt="Blog image"></div>
        </section>
        <div class="post-body" id="postBody"></div>

        <section class="related">
            <h2>Other stories</h2>
            <div class="related-grid" id="relatedGrid"></div>
        </section>
    </main>

    <footer>
        <div class="container footer-inner">&copy; 2026 Timeless Tales. All rights reserved.</div>
    </footer>

    <script>
        const blogPosts = [
            {
                id: 1,
                title: '5 Books to Read This Year',
                date: 'May 2026',
                author: 'Amelia Hart',
                image: 'images/book-covers/To_Kill_a_Mockingbir_1.png',
                excerpt: 'A curated selection of novels and memoirs for modern readers.',
                content: [
                    'The right book can change your year. This list mixes classic storytelling with unforgettable new voices and compelling themes.',
                    'Include one book that challenges your assumptions, one that comforts you, and one that expands your understanding of the world.',
                    'Share your progress with a reading partner, and let the joy of a great story guide your next selection.'
                ]
            },
            {
                id: 2,
                title: 'How to Build a Reading Habit',
                date: 'April 2026',
                author: 'Noah Reed',
                image: 'images/book-covers/Pride_and_Prejudice_3.png',
                excerpt: 'Tiny routines that turn reading from a goal into a daily joy.',
                content: [
                    'Start with just ten minutes a day. Small, consistent reading sessions are the secret to keeping books in your life without pressure.',
                    'Choose a time that feels natural—before sleep, during lunch, or while waiting for your coffee. Make the moment yours.',
                    'Track your books with a simple journal, and celebrate every finished title as progress toward a lifelong reading habit.'
                ]
            },
            {
                id: 3,
                title: 'Why Memoirs Matter',
                date: 'March 2026',
                author: 'Sofia Lane',
                image: 'images/book-covers/The_Kite_Runner_13.png',
                excerpt: 'Memoirs offer perspective, empathy, and inspiration from lived experience.',
                content: [
                    'Memoirs let us walk in another person’s shoes. They’re powerful because they are honest, layered, and often unexpectedly tender.',
                    'Whether the author writes about travel, recovery, or creativity, memoirs invite us to reflect on our own stories.',
                    'Let these books remind you that human experiences are varied yet deeply connected. Read with an open heart.'
                ]
            },
            {
                id: 4,
                title: 'The Reader’s Journey: Finding Your Next Favorite',
                date: 'February 2026',
                author: 'Maya Collins',
                image: 'images/book-covers/Harry_Potter_and_the_7.png',
                excerpt: 'Explore the best way to discover books that stick with you.',
                content: [
                    'Your next favorite book might be waiting in a genre you have not yet explored. Use recommendations to discover surprising new reads.',
                    'Don’t judge a book by a single page. Give it a fair chance, and let the story unfold before deciding whether it belongs on your list.',
                    'Keep a reading list, revisit titles that moved you, and stay curious. The journey is as rewarding as the destination.'
                ]
            }
        ];

        function getPostId() {
            return parseInt(new URLSearchParams(window.location.search).get('id')) || 1;
        }

        function loadPost() {
            const id = getPostId();
            const post = blogPosts.find(item => item.id === id) || blogPosts[0];
            document.getElementById('pageTitle').textContent = `Timeless Tales | ${post.title}`;
            document.getElementById('postTitle').textContent = post.title;
            document.getElementById('postMeta').textContent = `${post.date} · ${post.author}`;
            document.getElementById('postImage').src = post.image;
            document.getElementById('postImage').alt = post.title;
            const body = document.getElementById('postBody');
            body.innerHTML = post.content.map(paragraph => `<p>${paragraph}</p>`).join('');
            renderRelated(id);
        }

        function renderRelated(currentId) {
            const relatedGrid = document.getElementById('relatedGrid');
            relatedGrid.innerHTML = blogPosts.filter(post => post.id !== currentId).map(post => `
                <article class="related-card">
                    <img src="${post.image}" alt="${post.title}">
                    <div class="related-body">
                        <div class="related-title">${post.title}</div>
                        <div class="related-excerpt">${post.excerpt}</div>
                        <a href="blog-detail.html?id=${post.id}">Read more</a>
                    </div>
                </article>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadPost();
            const loader = document.getElementById('pageLoader');
            if (loader) {
                loader.classList.add('loaded');
                setTimeout(() => loader.remove(), 600);
            }
        });
    </script>

</body>
</html>
