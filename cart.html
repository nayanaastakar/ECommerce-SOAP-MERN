<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeless Tales | Cart</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="images/timeless-tales-favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#7B2CBF">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f3f4f6; color: #111827; }
        .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
        header { background: white; box-shadow: 0 10px 30px rgba(15,23,42,0.08); position: sticky; top: 0; z-index: 1000; }
        .header-inner { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 18px 24px; }
        .logo { font-size: 1.6rem; font-weight: 800; color: #1f2937; text-decoration: none; display: inline-flex; align-items: center; gap: 10px; }
        .nav { display: flex; gap: 12px; flex-wrap: wrap; }
        .nav a { color: #4b5563; text-decoration: none; padding: 10px 16px; border-radius: 999px; transition: background 0.2s ease; }
        .nav a:hover { background: #e0e7ff; }
        .page-title { margin: 28px 0 18px; font-size: 2rem; font-weight: 700; }
        .cart-grid { display: grid; gap: 24px; grid-template-columns: 1.35fr 0.65fr; }
        .cart-items, .order-summary { background: white; border-radius: 24px; padding: 24px; box-shadow: 0 16px 40px rgba(15,23,42,0.06); }
        .cart-item { display: grid; grid-template-columns: 120px 1fr 100px; gap: 18px; align-items: center; padding: 18px 0; border-bottom: 1px solid #e5e7eb; }
        .cart-item:last-child { border-bottom: none; }
        .cart-item img { width: 100%; border-radius: 18px; object-fit: cover; }
        .item-info { display: grid; gap: 8px; }
        .item-title { font-weight: 700; color: #111827; }
        .item-meta { color: #6b7280; font-size: 0.95rem; }
        .quantity-controls { display: flex; gap: 10px; align-items: center; }
        .quantity-controls button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid #d1d5db; background: white; color: #111827; cursor: pointer; }
        .quantity-count { min-width: 24px; text-align: center; }
        .remove-button { color: #ef4444; cursor: pointer; background: none; border: none; font-weight: 600; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 16px; color: #4b5563; }
        .summary-row.total { font-weight: 700; color: #111827; font-size: 1.1rem; }
        .checkout-button { width: 100%; border: none; padding: 16px 20px; border-radius: 16px; background: #4338ca; color: white; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background 0.2s ease; }
        .checkout-button:hover { background: #3730a3; }
        .empty-state { text-align: center; color: #6b7280; padding: 60px 20px; }
        .empty-state a { color: #4338ca; font-weight: 600; }
        footer { margin-top: 40px; text-align: center; color: #6b7280; }
        @media (max-width: 860px) { .cart-grid { grid-template-columns: 1fr; } }
    
        /* Timeless Tales brand overrides */
        :root {
            --tt-bg: #F8F5E9;
            --tt-surface: #FFFFFF;
            --tt-surface-soft: #F4EDFA;
            --tt-purple: #7B2CBF;
            --tt-purple-light: #C77DFF;
            --tt-green: #52B788;
            --tt-text: #1D1D35;
            --tt-muted: #5A5B7A;
            --tt-border: rgba(123,44,191,0.14);
        }
        body {
            background: var(--tt-bg) !important;
            color: var(--tt-text) !important;
            font-family: 'Poppins', sans-serif !important;
        }
        header, footer, .card, .detail-panel, .order-summary, .image-card, .related-card, .auth-wrapper, .post-card, .cart-items, .summary-row, .feature-card, .contact-grid > div, .cart-item, .product-grid > .card {
            background: var(--tt-surface) !important;
            border: 1px solid var(--tt-border) !important;
            box-shadow: 0 24px 60px rgba(123,44,191,0.08) !important;
        }
        .logo-img { width: 44px; height: auto; display: inline-block; }
        .logo { color: var(--tt-text) !important; display: inline-flex !important; align-items: center !important; gap: 10px !important; }
        .nav a { color: var(--tt-text) !important; padding: 10px 16px !important; border-radius: 999px !important; transition: background 0.2s ease !important; }
        .nav a:hover { background: rgba(123,44,191,0.1) !important; }
        .btn-primary, .small-btn, .checkout-button, .btn { background: linear-gradient(135deg, var(--tt-purple), var(--tt-purple-light)) !important; color: white !important; }
        .btn-secondary { background: rgba(123,44,191,0.08) !important; color: var(--tt-purple) !important; border: 1px solid rgba(123,44,191,0.18) !important; }
        .search-card, .field input, .field select, .field textarea, .box, .cart-item { border-radius: 18px !important; }
        .page-loader { position: fixed; inset: 0; background: rgba(248,245,233,0.96); display: flex; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.4s ease; }
        .page-loader.loaded { opacity: 0; pointer-events: none; }
        .loader-card { background: white; max-width: 320px; width: 100%; border-radius: 28px; padding: 30px; text-align: center; box-shadow: 0 30px 80px rgba(123,44,191,0.14); border: 1px solid rgba(123,44,191,0.12); }
        .loader-card img { width: 72px; margin-bottom: 18px; }
        .loader-ring { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 50%; border: 5px solid rgba(123,44,191,0.18); border-top-color: var(--tt-purple); animation: spin 1s linear infinite; }
        .loader-text { margin-top: 10px; color: var(--tt-muted); font-size: 0.98rem; }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div class="page-loader" id="pageLoader">
        <div class="loader-card">
            <img src="images/timeless-tales-logo.svg" alt="Timeless Tales logo">
            <div class="loader-ring"></div>
            <div class="loader-text">Timeless Tales — A magical world of books and stories.</div>
        </div>
    </div>

    <header>
        <div class="container header-inner">
            <a class="logo" href="index.html"><img class="logo-img" src="images/timeless-tales-logo.svg" alt="Timeless Tales logo"> Timeless Tales</a>
            <nav class="nav">
                <a href="index.html">Home</a>
                <a href="soap-simple.html">Books</a>
                <a href="blog.html">Blog</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                            <a href="admin.html">Admin</a>
            </nav>
        </div>
    </header>
    <main class="container">
        <h1 class="page-title">Shopping Cart</h1>
        <div class="cart-grid">
            <section class="cart-items">
                <div id="cartContent"></div>
            </section>
            <aside class="order-summary">
                <h2 style="margin-bottom:18px;">Order Summary</h2>
                <div class="summary-row"><span>Subtotal</span><span id="subtotal">₹0</span></div>
                <div class="summary-row"><span>Delivery</span><span id="deliveryFee">₹49</span></div>
                <div class="summary-row total"><span>Total</span><span id="orderTotal">₹0</span></div>
                <button class="checkout-button" onclick="location.href='payment.html'">Proceed to Checkout</button>
            </aside>
        </div>
        <footer>&copy; 2026 Timeless Tales. All rights reserved.</footer>
    </main>
    <script>
        const cartKey = 'timelessTalesCart';

        function getCart() {
            return JSON.parse(localStorage.getItem(cartKey) || '[]');
        }

        function saveCart(cart) {
            localStorage.setItem(cartKey, JSON.stringify(cart));
        }

        function updateCartCount() {
            const count = getCart().reduce((sum, item) => sum + item.quantity, 0);
            const badge = document.querySelector('.cart-count');
            if (badge) {
                badge.textContent = count;
                badge.classList.toggle('empty', count === 0);
            }
        }

        function formatPrice(value) {
            return `₹${value}`;
        }

        function renderCart() {
            const cart = getCart();
            const cartContent = document.getElementById('cartContent');
            const subtotalEl = document.getElementById('subtotal');
            const orderTotalEl = document.getElementById('orderTotal');
            if (!cartContent || !subtotalEl || !orderTotalEl) return;
            if (cart.length === 0) {
                cartContent.innerHTML = `<div class="empty-state"><p>Your cart is empty.</p><p><a href="soap-simple.html">Continue shopping</a></p></div>`;
                subtotalEl.textContent = '₹0';
                orderTotalEl.textContent = '₹0';
                return;
            }
            let subtotal = 0;
            cartContent.innerHTML = cart.map(item => {
                const itemTotal = item.price * item.quantity;
                subtotal += itemTotal;
                return `
                    <div class="cart-item">
                        <img src="${item.image}" alt="${item.name}">
                        <div class="item-info">
                            <div class="item-title">${item.name}</div>
                            <div class="item-meta">by ${item.author}</div>
                            <div class="item-meta">${formatPrice(item.price)} each</div>
                            <button class="remove-button" onclick="removeItem(${item.id})">Remove</button>
                        </div>
                        <div class="quantity-controls">
                            <button onclick="changeQuantity(${item.id}, -1)">-</button>
                            <span class="quantity-count">${item.quantity}</span>
                            <button onclick="changeQuantity(${item.id}, 1)">+</button>
                        </div>
                    </div>
                `;
            }).join('');
            subtotalEl.textContent = formatPrice(subtotal);
            orderTotalEl.textContent = formatPrice(subtotal + 49);
            updateCartCount();
        }

        function changeQuantity(id, delta) {
            const cart = getCart();
            const item = cart.find(entry => entry.id === id);
            if (!item) return;
            item.quantity += delta;
            if (item.quantity < 1) {
                const index = cart.findIndex(entry => entry.id === id);
                cart.splice(index, 1);
            }
            saveCart(cart);
            renderCart();
        }

        function removeItem(id) {
            const cart = getCart().filter(entry => entry.id !== id);
            saveCart(cart);
            renderCart();
        }

        document.addEventListener('DOMContentLoaded', renderCart);
    </script>

    <script>
        window.addEventListener('load', () => {
            const loader = document.getElementById('pageLoader');
            if (loader) {
                loader.classList.add('loaded');
                setTimeout(() => loader.remove(), 600);
            }
        });
    </script>

</body>
</html>
