<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lushlather - Premium Soap Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Cleaned and simplified styles for the product listing */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f6f7fb; color: #2c3e50; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.06); position: sticky; top: 0; z-index: 1000; }
        .header-inner { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:12px 20px; }
        .logo { font-weight:800; color:#9b59b6; text-decoration:none; font-size:1.6rem; display:flex; align-items:center; gap:8px; }
        .nav { display:flex; gap:12px; align-items:center; }
        .nav a { text-decoration:none; color:#2c3e50; padding:8px 12px; border-radius:8px; }
        .hero { background: linear-gradient(135deg,#9b59b6,#e91e63); color:white; padding:60px 20px; text-align:center; border-radius:8px; margin:20px 0; }
        .hero h1 { font-size:2rem; margin-bottom:10px; }
        .product-grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap:20px; margin-top:20px; }
        .card { background:white; border-radius:12px; overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,0.06); display:flex; flex-direction:column; }
        .card img { width:100%; height:180px; object-fit:cover; }
        .card-body { padding:14px; display:flex; flex-direction:column; gap:8px; flex:1; }
        .price { color:#9b59b6; font-weight:700; font-size:1.1rem; }
        .add-btn { margin-top:auto; background:#9b59b6; color:white; border:none; padding:10px; border-radius:8px; cursor:pointer; font-weight:600; }
        .add-btn:active { transform:scale(0.99); }
        footer { text-align:center; color:#6c757d; padding:30px 0; }
        .cart-count { background:#e74c3c;color:white;padding:2px 8px;border-radius:12px;font-weight:700;margin-left:6px;font-size:0.85rem; }
    </style>
</head>
<body>
    <header>
        <div class="container header-inner">
            <a class="logo" href="soap-simple.html">Lushlather</a>
            <nav class="nav">
                <a href="soap-simple.html">Shop</a>
                <a href="cart.html">Cart <span id="headerCartCount" class="cart-count">0</span></a>
                <a href="login.html">Login</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Handcrafted premium soaps</h1>
            <p>Natural ingredients · Gentle on skin · Beautifully scented</p>
        </section>

        <section>
            <h2 class="section-title">Our Collection</h2>
            <div id="productGrid" class="product-grid"></div>
        </section>
    </main>

    <footer>
        <div class="container">
            &copy; 2026 Lushlather. All rights reserved.
        </div>
    </footer>

    <script>
        // Simple product list (uses images included in /images)
        const products = [
            { id: 1, name: 'Lavender Bliss', price: 199, image: 'images/soap1.jpg', description: 'Calming lavender soap.' },
            { id: 2, name: 'Citrus Burst', price: 149, image: 'images/soap2.jpg', description: 'Refreshing citrus fragrance.' },
            { id: 3, name: 'Coconut Cream', price: 249, image: 'images/soap3.jpg', description: 'Hydrating coconut formula.' },
            { id: 4, name: 'Herbal Garden', price: 179, image: 'images/soap4.jpg', description: 'Botanical herbal blend.' },
            { id: 5, name: 'Rose Delight', price: 219, image: 'images/soap5.jpg', description: 'Romantic rose aroma.' }
        ];

        function getCart() {
            return JSON.parse(localStorage.getItem('lushlatherCart') || '[]');
        }
        function saveCart(cart) {
            localStorage.setItem('lushlatherCart', JSON.stringify(cart));
        }

        function addToCart(id) {
            const prod = products.find(p => p.id === id);
            if (!prod) return;
            const cart = getCart();
            const existing = cart.find(i => i.id === id);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ id: prod.id, name: prod.name, price: prod.price, image: prod.image, quantity: 1 });
            }
            saveCart(cart);
            updateHeaderCartCount();
            alert(prod.name + ' added to cart');
        }

        function updateHeaderCartCount() {
            const cart = getCart();
            const count = cart.reduce((s,i) => s + i.quantity, 0);
            const el = document.getElementById('headerCartCount');
            if (el) el.textContent = count;
        }

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = products.map(p => `\n                <div class="card">\n                    <img src="${p.image}" alt="${p.name}">\n                    <div class="card-body">\n                        <div class="product-name">${p.name}</div>\n                        <div class="product-description">${p.description}</div>\n                        <div class="price">₹${p.price}</div>\n                        <button class="add-btn" onclick="addToCart(${p.id})">Add to cart</button>\n                    </div>\n                </div>\n            `).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderProducts();
            updateHeaderCartCount();
        });
    </script>
</body>
</html>
