<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeless Tales Blog</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="images/timeless-tales-favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#7B2CBF">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f8fafc; color: #1f2937; }
        .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
        header, footer { background: white; box-shadow: 0 10px 30px rgba(15,23,42,0.08); }
        .header-inner, .footer-inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 24px; }
        .logo { font-size: 1.6rem; font-weight: 700; color: #1f2937; text-decoration: none; display: inline-flex; gap: 8px; }
        .nav { display: flex; flex-wrap: wrap; gap: 12px; }
        .nav a { color: #475569; text-decoration: none; padding: 10px 14px; border-radius: 999px; transition: background 0.2s ease; }
        .nav a:hover { background: #eef2ff; }
        .hero { padding: 48px 0; }
        .hero h1 { font-size: clamp(2.4rem, 4vw, 3.4rem); margin-bottom: 18px; }
        .hero p { max-width: 760px; color: #475569; line-height: 1.8; }
        .posts { display: grid; gap: 24px; margin-top: 32px; }
        .post-card { background: white; border-radius: 24px; overflow: hidden; box-shadow: 0 18px 40px rgba(15,23,42,0.06); display: grid; grid-template-columns: 1.1fr 0.9fr; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }
        .post-content { padding: 28px; display: flex; flex-direction: column; gap: 16px; }
        .post-title { font-size: 1.45rem; font-weight: 700; }
        .post-text { color: #475569; line-height: 1.8; }
        .read-more { color: #4338ca; font-weight: 700; }
        @media (max-width: 860px) { .post-card { grid-template-columns: 1fr; } }
        .footer { margin-top: 40px; }
    
        /* Timeless Tales brand overrides */
        :root {
            --tt-bg: #F8F5E9;
            --tt-surface: #FFFFFF;
            --tt-surface-soft: #F4EDFA;
            --tt-purple: #7B2CBF;
            --tt-purple-light: #C77DFF;
            --tt-green: #52B788;
            --tt-text: #1D1D35;
            --tt-muted: #5A5B7A;
            --tt-border: rgba(123,44,191,0.14);
        }
        body {
            background: var(--tt-bg) !important;
            color: var(--tt-text) !important;
            font-family: 'Poppins', sans-serif !important;
        }
        header, footer, .card, .detail-panel, .order-summary, .image-card, .related-card, .auth-wrapper, .post-card, .cart-items, .summary-row, .feature-card, .contact-grid > div, .cart-item, .product-grid > .card {
            background: var(--tt-surface) !important;
            border: 1px solid var(--tt-border) !important;
            box-shadow: 0 24px 60px rgba(123,44,191,0.08) !important;
        }
        .logo-img { width: 44px; height: auto; display: inline-block; }
        .logo { color: var(--tt-text) !important; display: inline-flex !important; align-items: center !important; gap: 10px !important; }
        .nav a { color: var(--tt-text) !important; padding: 10px 16px !important; border-radius: 999px !important; transition: background 0.2s ease !important; }
        .nav a:hover { background: rgba(123,44,191,0.1) !important; }
        .btn-primary, .small-btn, .checkout-button, .btn { background: linear-gradient(135deg, var(--tt-purple), var(--tt-purple-light)) !important; color: white !important; }
        .btn-secondary { background: rgba(123,44,191,0.08) !important; color: var(--tt-purple) !important; border: 1px solid rgba(123,44,191,0.18) !important; }
        .search-card, .field input, .field select, .field textarea, .box, .cart-item { border-radius: 18px !important; }
        .page-loader { position: fixed; inset: 0; background: rgba(248,245,233,0.96); display: flex; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.4s ease; }
        .page-loader.loaded { opacity: 0; pointer-events: none; }
        .loader-card { background: white; max-width: 320px; width: 100%; border-radius: 28px; padding: 30px; text-align: center; box-shadow: 0 30px 80px rgba(123,44,191,0.14); border: 1px solid rgba(123,44,191,0.12); }
        .loader-card img { width: 72px; margin-bottom: 18px; }
        .loader-ring { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 50%; border: 5px solid rgba(123,44,191,0.18); border-top-color: var(--tt-purple); animation: spin 1s linear infinite; }
        .loader-text { margin-top: 10px; color: var(--tt-muted); font-size: 0.98rem; }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div class="page-loader" id="pageLoader">
        <div class="loader-card">
            <img src="images/timeless-tales-logo.svg" alt="Timeless Tales logo">
            <div class="loader-ring"></div>
            <div class="loader-text">Timeless Tales — A magical world of books and stories.</div>
        </div>
    </div>

    <header>
        <div class="container header-inner">
            <a class="logo" href="index.html"><img class="logo-img" src="images/timeless-tales-logo.svg" alt="Timeless Tales logo"> Timeless Tales</a>
            <nav class="nav">
                <a href="index.html">Home</a>
                <a href="soap-simple.html">Books</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a href="privacy.html">Privacy</a>
                            <a href="admin.html">Admin</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Timeless Tales Blog</h1>
            <p>Read tips on reading, book recommendations, and stories behind the books you love.</p>
        </section>

        <div class="posts" id="postsGrid"></div>
    </main>

    <footer>
        <div class="container footer-inner">&copy; 2026 Timeless Tales. All rights reserved.</div>
    </footer>

    <script>
        const blogPosts = [
            {
                id: 1,
                title: '5 Books to Read This Year',
                date: 'May 2026',
                author: 'Amelia Hart',
                excerpt: 'From gripping thrillers to inspiring memoirs, discover a balanced reading list for every mood and every shelf.',
                image: 'images/book-covers/To_Kill_a_Mockingbir_1.png',
                content: [
                    'Start the year with books that spark imagination, comfort, and curiosity. Each recommendation is selected for its unforgettable story and strong emotional pull.',
                    'Choose one novel that pushes your genre boundaries and one memoir that offers a new perspective. Add a classic and a contemporary hit for range.',
                    'Make time for reading by setting a weekly goal, creating a cozy nook, and sharing notes with friends.',
                ]
            },
            {
                id: 2,
                title: 'How to Build a Reading Habit',
                date: 'April 2026',
                author: 'Noah Reed',
                excerpt: 'Small daily routines make it easy to read more. Learn how to create lasting habits around the books you love.',
                image: 'images/book-covers/Pride_and_Prejudice_3.png',
                content: [
                    'Reading every day begins with tiny, consistent steps. Start with five minutes before bed or during your morning coffee, then let the habit grow.',
                    'Keep your next book visible, choose titles that excite you, and treat reading as a reward rather than a chore.',
                    'Use a reading journal or digital notes to capture memorable lines, questions, and ideas as you progress through each book.',
                ]
            },
            {
                id: 3,
                title: 'Why Memoirs Matter',
                date: 'March 2026',
                author: 'Sofia Lane',
                excerpt: 'Real stories from real lives can shift your perspective. Discover memoirs that inspire, challenge, and comfort.',
                image: 'images/book-covers/The_Kite_Runner_13.png',
                content: [
                    'Memoirs connect us to lives unlike our own. They invite empathy, provide lessons, and remind us that each person carries a story worth hearing.',
                    'Whether you prefer travel, recovery, or creative journeys, memoirs can be both grounding and transformative.',
                    'Read with an open mind, and allow the author’s honesty to inspire reflection on your own life and choices.',
                ]
            },
            {
                id: 4,
                title: 'The Reader’s Journey: Finding Your Next Favorite',
                date: 'February 2026',
                author: 'Maya Collins',
                excerpt: 'Navigate genres, discover hidden gems, and follow the books that lead you from one great read to the next.',
                image: 'images/book-covers/Harry_Potter_and_the_7.png',
                content: [
                    'A great reading journey starts with curiosity. If a book intrigues you, give it the first 50 pages before deciding whether it belongs on your shelf.',
                    'Use recommendations, reviews, and bookstore displays to explore unfamiliar titles. Sometimes the next favorite book is one you never expected.',
                    'Keep a list of books that move you, and revisit it when you need a new story or a familiar comfort read.',
                ]
            }
        ];

        function renderBlogPosts() {
            const grid = document.getElementById('postsGrid');
            grid.innerHTML = blogPosts.map(post => `
                <article class="post-card">
                    <div class="post-content">
                        <div class="post-title">${post.title}</div>
                        <div class="post-text">${post.excerpt}</div>
                        <div style="color: #6b7280; font-size: 0.95rem;">${post.date} · ${post.author}</div>
                        <a class="read-more" href="blog-detail.html?id=${post.id}">Read the story →</a>
                    </div>
                    <img src="${post.image}" alt="${post.title}">
                </article>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderBlogPosts();
            const loader = document.getElementById('pageLoader');
            if (loader) {
                loader.classList.add('loaded');
                setTimeout(() => loader.remove(), 600);
            }
        });
    </script>

    <script>
        window.addEventListener('load', () => {
            const loader = document.getElementById('pageLoader');
            if (loader) {
                loader.classList.add('loaded');
                setTimeout(() => loader.remove(), 600);
            }
        });
    </script>

</body>
</html>
